// ── FACTORIES ────────────────────────────────────────────────
const blankProduct=()=>({productId:uid(),code:'',name:'',description:'',price:'',usp:'',useCase:'',needState:'',salesChannels:[],onlineLinks:[],storeLocations:[]});
const blankBrand=()=>({
  brandId:uid(),code:'',brandName:'',industry:'',industryOther:'',website:'',tagline:'',logoUrl:'',
  socialHandles:{instagram:'',tiktok:'',facebook:'',linkedin:'',shopee:'',lazada:'',youtube:'',whatsapp:''},
  voice:{colors:['#4a86f5'],archetype:'',tones:[],personality:[],writingStyle:'',dos:[],donts:[],sampleCopy:''},
  audience:{description:'',ageRanges:[],gender:'',country:'Malaysia',malaysiaStates:[],incomeRanges:[],interests:[],painPoints:[],motivations:[],behavior:''},
  messaging:{usp:'',keyMessages:[],differentiation:'',cta:'',competitors:[],proofPoints:[]},
  platforms:{active:[],frequency:'',formats:[]},
  emailKit:{footer:'',bannerUrl:'',ctas:[]},
  refs:{brandCIUrl:'',sampleCreativeUrls:[]},
  products:[]
});
const blankClient=()=>({
  id:uid(),code:'',status:'onboarding',createdAt:now(),updatedAt:now(),
  client:{legalName:'',displayName:'',parentCompany:'',address:'',billing:{retainerRM:'',terms:''},primaryContact:CB(),secondaryContact:CB(),notes:''},
  brands:[]
});

// Backward-compat: convert an OLD-shape record (data.basics/voice/...) into the new client/brand/product shape.
function migrate(c){
  if(!c) return blankClient();
  if(Array.isArray(c.brands)) return c; // already new shape
  const b=c.basics||{},v=c.voice||{},a=c.audience||{},m=c.messaging||{},p=c.platforms||{};
  const brand=blankBrand();
  brand.brandId='b_'+(c.id||'');
  Object.assign(brand,{
    brandName:b.brandName||b.clientName||'',industry:b.industry||'',industryOther:b.industryOther||'',website:b.website||'',tagline:v.tagline||'',
    socialHandles:Object.assign(brand.socialHandles,b.socialHandles||{}),
    voice:{colors:v.colors||['#4a86f5'],archetype:v.archetype||'',tones:v.tones||[],personality:v.personality||[],writingStyle:v.writingStyle||'',dos:v.dos||[],donts:v.donts||[],sampleCopy:v.sampleCopy||''},
    audience:{description:a.description||'',ageRanges:a.ageRanges||[],gender:a.gender||'',country:a.countryLocation||a.country||'Malaysia',malaysiaStates:a.malaysiaStates||[],incomeRanges:a.incomeRanges||[],interests:a.interests||[],painPoints:a.painPoints||[],motivations:a.motivations||[],behavior:a.behavior||''},
    messaging:{usp:m.usp||'',keyMessages:m.keyMessages||[],differentiation:m.differentiation||'',cta:m.cta||'',competitors:[...(b.competitorBrands||[]),...(m.competitors||[])],proofPoints:[]},
    platforms:{active:p.active||[],frequency:p.frequency||'',formats:p.formats||[]},
    emailKit:c.emailKit||{footer:'',bannerUrl:'',ctas:[]},
    refs:{brandCIUrl:v.brandCIUrl||'',sampleCreativeUrls:v.sampleCreativeUrls||[]},
    products:(c.products||[]).map(pr=>Object.assign(blankProduct(),pr))
  });
  return {
    id:c.id||uid(),code:c.code||'',status:c.status||'onboarding',createdAt:c.createdAt||now(),updatedAt:c.updatedAt||now(),
    client:{legalName:b.clientName||'',displayName:b.brandName||b.clientName||'',parentCompany:b.parentCompany||'',address:b.companyAddress||'',billing:{retainerRM:b.retainerRM||'',terms:''},primaryContact:b.primaryContact||CB(),secondaryContact:b.secondaryContact||CB(),notes:b.notes||''},
    brands:[brand]
  };
}

const db={
  async getSetting(k){try{const r=await fetch(`${SB_URL}/rest/v1/settings?key=eq.${k}&select=value`,{headers:SBH});const d=await r.json();return d[0]?.value||null;}catch{return null;}},
  async setSetting(k,v){try{await fetch(`${SB_URL}/rest/v1/settings`,{method:'POST',headers:{...SBH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({key:k,value:v,updated_at:now()})});}catch(e){console.error(e);}},
  async getClients(){try{const r=await fetch(`${SB_URL}/rest/v1/clients?select=*&order=created_at.desc`,{headers:SBH});const d=await r.json();return Array.isArray(d)?d.map(x=>migrate(x.data)):[];}catch(e){console.error(e);return[];}},
  async upsertClient(c){try{await fetch(`${SB_URL}/rest/v1/clients`,{method:'POST',headers:{...SBH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id:c.id,code:c.code||null,status:c.status,updated_at:c.updatedAt,data:c})});}catch(e){console.error(e);}},
  async deleteClient(id){try{await fetch(`${SB_URL}/rest/v1/clients?id=eq.${id}`,{method:'DELETE',headers:SBH});}catch(e){console.error(e);}},
};

// ── STABLE COMPONENTS ────────────────────────────────────────
function TagInput({tags=[],onAdd,onRemove,placeholder}){
  const[v,sv]=useState('');
  return html`<div>
    ${tags.length>0&&html`<div style=${{display:'flex',flexWrap:'wrap',gap:5,marginBottom:6}}>
      ${tags.map((t,i)=>html`<span key=${i} style=${{background:C.s3,border:`0.5px solid ${C.bd}`,borderRadius:4,padding:'2px 8px',fontSize:12,color:C.dm,display:'flex',alignItems:'center',gap:4}}>${t}<span onClick=${()=>onRemove(i)} style=${{cursor:'pointer',color:C.mt,fontSize:16,lineHeight:1,marginLeft:2}}>×</span></span>`)}
    </div>`}
    <input style=${inp()} value=${v} placeholder=${placeholder||'Type and press Enter'} onChange=${e=>sv(e.target.value)} onKeyDown=${e=>{if((e.key==='Enter'||e.key===',')&&v.trim()){e.preventDefault();onAdd(v.trim());sv('');}if(e.key==='Backspace'&&!v&&tags.length>0)onRemove(tags.length-1);}}/>
  </div>`;
}
function Chips({opts=[],selected=[],onToggle}){
  return html`<div style=${{display:'flex',flexWrap:'wrap',gap:6}}>
    ${opts.map(o=>{const k=typeof o==='object'?o.k:o,l=typeof o==='object'?o.v:o,on=selected.includes(k);
      return html`<button key=${k} onClick=${()=>onToggle(k)} style=${{background:on?C.ac:C.s3,color:on?'#fff':C.dm,border:`0.5px solid ${on?C.ac:C.bd}`,borderRadius:20,padding:'4px 12px',fontSize:12,cursor:'pointer'}}>${l}</button>`;
    })}
  </div>`;
}
function SBadge({status}){const c=SCFG[status]||SCFG.onboarding;return html`<span style=${{background:`${c.c}1a`,color:c.c,border:`0.5px solid ${c.c}50`,borderRadius:20,padding:'2px 10px',fontSize:11,fontWeight:500,whiteSpace:'nowrap'}}>${c.l}</span>`;}
function Lb({children}){return html`<div style=${{fontSize:11,color:C.dm,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5}}>${children}</div>`;}
function Fd({label,span2,hint,children}){return html`<div style=${{gridColumn:span2?'span 2':'span 1'}}><${Lb}>${label}</${Lb}>${children}${hint&&html`<div style=${{fontSize:11,color:C.mt,marginTop:4,lineHeight:1.5}}>${hint}</div>`}</div>`;}
function Sec({t,children}){return html`<div style=${{marginBottom:22}}><div style=${{fontSize:11,color:C.ac,textTransform:'uppercase',letterSpacing:'1px',marginBottom:12,paddingBottom:7,borderBottom:`0.5px solid ${C.bd}`}}>${t}</div>${children}</div>`;}
function Hint({children}){return html`<div style=${{fontSize:11,color:C.mt,marginTop:4,lineHeight:1.5}}>${children}</div>`;}
function Spinner(){return html`<div style=${{display:'flex',alignItems:'center',justifyContent:'center',gap:10,padding:'40px',color:C.dm,fontSize:13}}><div style=${{width:18,height:18,border:`2px solid ${C.bd}`,borderTop:`2px solid ${C.ac}`,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}></div>Loading from Supabase…</div>`;}

// ── MAIN APP ─────────────────────────────────────────────────
function App(){
  const[locked,setLocked]=useState(true);
  const[pmode,setPmode]=useState('check');
  const[pin,setPin]=useState('');const[pin2,setPin2]=useState('');
  const[pErr,setPErr]=useState('');const[savedPin,setSavedPin]=useState(null);
  const[clients,setClients]=useState([]);
  const[loading,setLoading]=useState(true);
  const[view,setView]=useState('dash'); // dash | brand | client | clients
  const[edClient,setEdClient]=useState(null);     // client being edited (client view)
  const[edBrand,setEdBrand]=useState(null);        // brand being edited (brand view)
  const[edBrandCid,setEdBrandCid]=useState('');    // parent client id for edBrand
  const[isNewBrand,setIsNewBrand]=useState(false);
  const[tab,setTab]=useState(0);
  const[srch,setSrch]=useState('');
  const[fClient,setFClient]=useState('all');
  const[saving,setSaving]=useState(false);
  const[toast,setToast]=useState('');const[toastType,setToastType]=useState('ok');
  const[copied,setCopied]=useState(false);

  useEffect(()=>{(async()=>{
    const p=await db.getSetting('pin');
    if(p)setSavedPin(p);else setPmode('create');
    setClients(await db.getClients());
    setLoading(false);
  })();},[]);

  const showToast=(m,t='ok')=>{setToast(m);setToastType(t);setTimeout(()=>setToast(''),2800);};
  function doPin(){
    if(pmode==='create'){if(pin.length<4){setPErr('Min 4 chars');return;}if(pin!==pin2){setPErr('PINs do not match');return;}db.setSetting('pin',pin);setSavedPin(pin);setLocked(false);}
    else{if(pin===savedPin){setLocked(false);setPErr('');}else{setPErr('Incorrect PIN');setPin('');}}
  }
  async function refresh(){setClients(await db.getClients());}
  const goDash=()=>{setView('dash');setEdClient(null);setEdBrand(null);};

  // Flatten brands across all clients for the grid
  const brandRows=clients.flatMap(c=>(c.brands||[]).map(b=>({brand:b,cid:c.id,clientName:c.client?.displayName||c.client?.legalName||'Unnamed client',clientCode:c.code,status:c.status})));
  const mrr=clients.reduce((s,c)=>s+(parseInt(c.client?.billing?.retainerRM)||0),0);
  const filtered=brandRows.filter(r=>{
    const n=((r.brand.brandName||'')+' '+r.clientName).toLowerCase();
    return (fClient==='all'||r.cid===fClient)&&(!srch||n.includes(srch.toLowerCase()));
  });

  // ── brand edit handlers ──
  function openBrand(cid,brand){setEdBrandCid(cid);setEdBrand(JSON.parse(JSON.stringify(brand)));setIsNewBrand(false);setTab(0);setView('brand');}
  function newBrand(){const cid=clients[0]?.id||'';setEdBrandCid(cid);setEdBrand(blankBrand());setIsNewBrand(true);setTab(0);setView('brand');}
  const sbTop=(f,v)=>setEdBrand(p=>({...p,[f]:v}));
  const sbf=(s,f,v)=>setEdBrand(p=>({...p,[s]:{...p[s],[f]:v}}));
  const sbH=(f,v)=>setEdBrand(p=>({...p,socialHandles:{...p.socialHandles,[f]:v}}));
  const sbAddTag=(s,f,v)=>{const a=edBrand[s][f]||[];if(!a.includes(v))sbf(s,f,[...a,v]);};
  const sbRmTag=(s,f,i)=>{const a=[...(edBrand[s][f]||[])];a.splice(i,1);sbf(s,f,a);};
  const sbTog=(s,f,v)=>{const a=edBrand[s][f]||[];sbf(s,f,a.includes(v)?a.filter(x=>x!==v):[...a,v]);};
  // products
  const pAdd=()=>setEdBrand(p=>({...p,products:[...p.products,blankProduct()]}));
  const pUpd=(i,f,v)=>{const ps=[...edBrand.products];ps[i]={...ps[i],[f]:v};setEdBrand(p=>({...p,products:ps}));};
  const pTog=(i,f,v)=>{const ps=[...edBrand.products];const a=ps[i][f]||[];ps[i]={...ps[i],[f]:a.includes(v)?a.filter(x=>x!==v):[...a,v]};setEdBrand(p=>({...p,products:ps}));};
  const pAddTag=(i,f,v)=>{const ps=[...edBrand.products];const a=ps[i][f]||[];if(!a.includes(v)){ps[i]={...ps[i],[f]:[...a,v]};setEdBrand(p=>({...p,products:ps}));}};
  const pRmTag=(i,f,j)=>{const ps=[...edBrand.products];const a=[...(ps[i][f]||[])];a.splice(j,1);ps[i]={...ps[i],[f]:a};setEdBrand(p=>({...p,products:ps}));};
  const pRm=i=>{const ps=[...edBrand.products];ps.splice(i,1);setEdBrand(p=>({...p,products:ps}));};

  async function saveBrand(){
    if(!edBrandCid){showToast('Pick which client this brand belongs to','er');setTab(0);return;}
    if(!edBrand.brandName.trim()){showToast('Brand name is required','er');setTab(0);return;}
    const c=clients.find(x=>x.id===edBrandCid);if(!c){showToast('Client not found','er');return;}
    setSaving(true);
    const brand={...edBrand,code:edBrand.code||slug(edBrand.brandName)};
    const exists=(c.brands||[]).some(b=>b.brandId===brand.brandId);
    const brands=exists?c.brands.map(b=>b.brandId===brand.brandId?brand:b):[...(c.brands||[]),brand];
    const updated={...c,brands,updatedAt:now()};
    await db.upsertClient(updated);await refresh();
    setSaving(false);showToast(exists?'Brand brief updated ✓':'Brand added ✓');goDash();
  }
  async function delBrand(){
    if(!confirm('Delete this brand brief? Cannot be undone.'))return;
    const c=clients.find(x=>x.id===edBrandCid);if(!c)return;
    const updated={...c,brands:(c.brands||[]).filter(b=>b.brandId!==edBrand.brandId),updatedAt:now()};
    await db.upsertClient(updated);await refresh();goDash();showToast('Brand deleted');
  }

  // ── client edit handlers ──
  function openClient(c){setEdClient(JSON.parse(JSON.stringify(c)));setView('client');}
  function newClient(){setEdClient(blankClient());setView('client');}
  const scf=(f,v)=>setEdClient(p=>({...p,client:{...p.client,[f]:v}}));
  const scC=(w,f,v)=>setEdClient(p=>({...p,client:{...p.client,[w]:{...p.client[w],[f]:v}}}));
  async function saveClient(){
    if(!edClient.client.legalName.trim()){showToast('Client legal/business name is required','er');return;}
    setSaving(true);
    const u={...edClient,code:edClient.code||slug(edClient.client.displayName||edClient.client.legalName),updatedAt:now()};
    await db.upsertClient(u);await refresh();
    setSaving(false);showToast('Client saved ✓');setEdClient(u);
  }
  async function delClient(id){
    if(!confirm('Delete this client and ALL its brands? Cannot be undone.'))return;
    await db.deleteClient(id);await refresh();goDash();showToast('Client deleted');
  }
  async function backup(){
    const b=new Blob([JSON.stringify(clients,null,2)],{type:'application/json'});
    const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='omniraai-clients-backup.json';a.click();URL.revokeObjectURL(u);
  }

  // n8n / generation context export for one brand
  function brandJson(cid,b){
    const c=clients.find(x=>x.id===cid)||{client:{}};
    return JSON.stringify({
      client_id:cid,client_code:c.code,brand_id:b.brandId,brand_code:b.code,generated_at:now(),
      client:{legal_name:c.client.legalName,display_name:c.client.displayName,parent_company:c.client.parentCompany},
      brand:{name:b.brandName,industry:b.industry==='Other'?b.industryOther:b.industry,website:b.website,tagline:b.tagline,logo_url:b.logoUrl,social_handles:b.socialHandles,
        voice:b.voice,audience:b.audience,messaging:b.messaging,platforms:b.platforms,email_kit:b.emailKit,refs:b.refs},
      products:b.products
    },null,2);
  }
  async function copyBrandJson(){try{await navigator.clipboard.writeText(brandJson(edBrandCid,edBrand));setCopied(true);setTimeout(()=>setCopied(false),2200);showToast('Brand JSON copied ✓');}catch{showToast('Copy failed','er');}}

  const G={display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px 20px'};

  // ── PIN ──
  if(locked)return html`
    <div style=${{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style=${{background:C.s1,border:`0.5px solid ${C.bd}`,borderRadius:14,padding:40,width:'100%',maxWidth:360,textAlign:'center'}}>
        <div style=${{width:60,height:60,borderRadius:16,background:`linear-gradient(135deg,${C.ac},${C.pu})`,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px',fontSize:26,fontWeight:700,color:'#fff'}}>O</div>
        <div style=${{fontSize:24,fontWeight:700,color:C.tx}}>OmniraAI</div>
        <div style=${{fontSize:13,color:C.dm,margin:'4px 0 28px'}}>Client Brand Brief${pmode==='create'?' — Create PIN':''}</div>
        <input style=${inp({marginBottom:10,textAlign:'center',letterSpacing:6,fontSize:20})} type="password" placeholder=${pmode==='create'?'Create PIN (min 4)':'Enter PIN'} value=${pin} onChange=${e=>setPin(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&(pmode==='check'?doPin():null)} autoFocus/>
        ${pmode==='create'&&html`<input style=${inp({marginBottom:14,textAlign:'center',letterSpacing:6,fontSize:20})} type="password" placeholder="Confirm PIN" value=${pin2} onChange=${e=>setPin2(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&doPin()}/>`}
        ${pErr&&html`<div style=${{color:C.er,fontSize:12,marginBottom:12}}>${pErr}</div>`}
        <button style=${pbtn(true,{width:'100%',padding:'11px 0',fontSize:15})} onClick=${doPin}>${pmode==='create'?'Create PIN & Enter →':'Unlock →'}</button>
        <div style=${{fontSize:11,color:C.mt,marginTop:16}}>OmniraAI · Powered by Supabase</div>
      </div>

          <div><${Lb}>Name</${Lb}><input style=${inp()} value=${p.name} onChange=${e=>pUpd(i,'name',e.target.value)} placeholder="e.g. Ace Ball Machine"/></div>
          <div><${Lb}>Code</${Lb}><input style=${inp()} value=${p.code} onChange=${e=>pUpd(i,'code',e.target.value.toUpperCase())} placeholder=${slug(p.name)||'ACE'}/></div>
          <div style=${{gridColumn:'span 2'}}><${Lb}>Description</${Lb}><textarea style=${inp({resize:'vertical',minHeight:54})} value=${p.description} onChange=${e=>pUpd(i,'description',e.target.value)} placeholder="What it is, why people love it…"/></div>
          <div><${Lb}>Price</${Lb}><input style=${inp()} value=${p.price} onChange=${e=>pUpd(i,'price',e.target.value)} placeholder="e.g. RM 4,999"/></div>
          <div><${Lb}>USP</${Lb}><input style=${inp()} value=${p.usp} onChange=${e=>pUpd(i,'usp',e.target.value)} placeholder="What makes it unique"/></div>
          <div><${Lb}>Use case</${Lb}><input style=${inp()} value=${p.useCase} onChange=${e=>pUpd(i,'useCase',e.target.value)} placeholder="e.g. Solo practice at home"/></div>
          <div><${Lb}>Need state</${Lb}><input style=${inp()} value=${p.needState} onChange=${e=>pUpd(i,'needState',e.target.value)} placeholder="e.g. Train without a partner"/></div>
          <div style=${{gridColumn:'span 2'}}><${Lb}>Sales channels</${Lb}><${Chips} opts=${SALES_CH} selected=${p.salesChannels||[]} onToggle=${v=>pTog(i,'salesChannels',v)}/></div>
          <div style=${{gridColumn:'span 2'}}><${Lb}>Online links</${Lb}><${TagInput} tags=${p.onlineLinks||[]} onAdd=${v=>pAddTag(i,'onlineLinks',v)} onRemove=${j=>pRmTag(i,'onlineLinks',j)} placeholder="Paste product URL…"/></div>
          <div style=${{gridColumn:'span 2'}}><${Lb}>Store locations</${Lb}><${TagInput} tags=${p.storeLocations||[]} onAdd=${v=>pAddTag(i,'storeLocations',v)} onRemove=${j=>pRmTag(i,'storeLocations',j)} placeholder="e.g. Pavilion KL…"/></div>
        </div>
      </div>`)}</div>`;
    if(tab===4)return html`<div>
      <${Sec} t="Active platforms"><${Chips} opts=${PLATS_USED} selected=${b.platforms.active} onToggle=${v=>sbTog('platforms','active',v)}/></${Sec}>
      <${Sec} t="Posting frequency"><${Chips} opts=${FREQS} selected=${b.platforms.frequency?[b.platforms.frequency]:[]} onToggle=${v=>sbf('platforms','frequency',b.platforms.frequency===v?'':v)}/></${Sec}>
      <${Sec} t="Content formats"><${Chips} opts=${FMTS} selected=${b.platforms.formats} onToggle=${v=>sbTog('platforms','formats',v)}/></${Sec}>`;
    if(tab===5)return html`<div style=${G}>
      <${Fd} label="Main USP" span2><textarea style=${inp({resize:'vertical',minHeight:72})} value=${b.messaging.usp} onChange=${e=>sbf('messaging','usp',e.target.value)} placeholder="What makes this brand genuinely different?"/></${Fd}>
      <${Fd} label="Primary CTA"><input style=${inp()} value=${b.messaging.cta} onChange=${e=>sbf('messaging','cta',e.target.value)} placeholder="e.g. Book a demo"/></${Fd}>
      <${Fd} label="Differentiation"><textarea style=${inp({resize:'vertical',minHeight:72})} value=${b.messaging.differentiation} onChange=${e=>sbf('messaging','differentiation',e.target.value)} placeholder="How does this brand win?"/></${Fd}>
      <${Fd} label="Key messages"><${TagInput} tags=${b.messaging.keyMessages} onAdd=${v=>sbAddTag('messaging','keyMessages',v)} onRemove=${i=>sbRmTag('messaging','keyMessages',i)} placeholder="e.g. Pro-grade at home…"/></${Fd}>
      <${Fd} label="Competitors"><${TagInput} tags=${b.messaging.competitors} onAdd=${v=>sbAddTag('messaging','competitors',v)} onRemove=${i=>sbRmTag('messaging','competitors',i)} placeholder="e.g. BrandX…"/></${Fd}>
      <${Fd} label="Proof points / credentials" span2 hint="Awards, certifications, testimonials, milestones"><${TagInput} tags=${b.messaging.proofPoints} onAdd=${v=>sbAddTag('messaging','proofPoints',v)} onRemove=${i=>sbRmTag('messaging','proofPoints',i)} placeholder="e.g. 5,000+ units sold…"/></${Fd}>
    </div>`;
    return null;
  }
  const brandView=edBrand&&html`
    <div style=${{maxWidth:880,margin:'0 auto',padding:'24px'}}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexWrap:'wrap',gap:10,marginBottom:14}}>
        <div><div style=${{fontSize:19,fontWeight:600,color:C.tx}}>${isNewBrand?'New brand brief':'Edit brand brief'}</div><div style=${{fontSize:13,color:C.dm,marginTop:2}}>${edBrand.brandName||'Untitled brand'}</div></div>
        ${!isNewBrand&&html`<button onClick=${copyBrandJson} style=${pbtn(false,{fontSize:12,padding:'6px 12px'})}>${copied?'✓ Copied':'⧉ Copy brand JSON'}</button>`}
      </div>
      <div style=${{marginBottom:16}}>
        <${Lb}>Client this brand belongs to</${Lb}>
        <select style=${inp({maxWidth:360})} value=${edBrandCid} disabled=${!isNewBrand} onChange=${e=>setEdBrandCid(e.target.value)}>
          <option value="">Select client…</option>
          ${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.client?.displayName||c.client?.legalName||c.id}</option>`)}
        </select>
        ${!isNewBrand&&html`<${Hint}>Move-between-clients isn't supported here — delete & recreate to reassign.</${Hint}>`}
      </div>
      <div style=${{display:'flex',gap:2,marginBottom:20,background:C.s2,padding:4,borderRadius:8,border:`0.5px solid ${C.bd}`,flexWrap:'wrap'}}>
        ${BRAND_TABS.map((t,i)=>html`<button key=${t} onClick=${()=>setTab(i)} style=${{flex:'1 1 auto',padding:'7px 6px',fontSize:12,cursor:'pointer',borderRadius:6,border:'none',background:tab===i?C.ac:'transparent',color:tab===i?'#fff':C.dm,fontWeight:tab===i?500:400}}>${t}</button>`)}
      </div>
      <div style=${{background:C.s1,border:`0.5px solid ${C.bd}`,borderRadius:10,padding:24,marginBottom:16}}>${brandTab()}</div>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',paddingBottom:40}}>
        <button onClick=${()=>setTab(t=>Math.max(0,t-1))} disabled=${tab===0} style=${pbtn(false,{opacity:tab===0?.3:1})}>← Previous</button>
        <span style=${{fontSize:12,color:C.mt}}>${tab+1} of ${BRAND_TABS.length}</span>
        ${tab<BRAND_TABS.length-1?html`<button onClick=${()=>setTab(t=>t+1)} style=${pbtn(true)}>Next →</button>`:html`<button onClick=${saveBrand} disabled=${saving} style=${pbtn(true,{padding:'8px 22px',fontWeight:500})}>${saving?'Saving…':'💾 Save Brand'}</button>`}
      </div>
    </div>`;

  return html`
    <div style=${{minHeight:'100vh',background:C.bg,color:C.tx}}>
      ${hdr}
      <div style=${{paddingBottom:48}}>${view==='dash'&&dash}${view==='clients'&&clientsView}${view==='client'&&clientView}${view==='brand'&&brandView}</div>
      ${toast&&html`<div style=${{position:'fixed',bottom:24,right:24,background:C.s1,border:`1px solid ${toastType==='ok'?C.ok:C.er}60`,borderRadius:8,padding:'10px 18px',fontSize:13,color:C.tx,zIndex:999}}>${toast}</div>`}
    </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
